**Documento Consolidado para Implementación Android**

Este expediente reúne la Constitución Metodológica, el Blueprint Técnico y el Código Fuente de los cuatro niveles operativos del Laboratorio AntroSapiens V4.

---

## 1. DOCUMENTACIÓN TÉCNICA Y METODOLÓGICA

### 1.1 Constitución Metodológica (Rigor Científico)
AntroSapiens V4 es un **Instrumento Científico de Indagación**. Su arquitectura responde al **Ciclo de Cristalización de Sentido**:
*   **Humano (Juicio):** Tipografía Newsreader. Jerarquía superior.
*   **IA (Inferencia):** Tipografía JetBrains Mono. Estética técnica/mineral.
*   **Ontología:** Señal → Evidencia → Tensión → Hipótesis → Dictamen.

### 1.2 Blueprint de Implementación Android
*   **Ergonomía:** Zona de pulgar activa en el tercio inferior. Targets táctiles de 48dp.
*   **Superficies:** Fondos *Parchment* (#FCFAED) y *Parchment Dim*. Prohibido el blanco puro (#FFFFFF).
*   **Regla G0:** Bloqueo de Nivel 3 si no hay evidencias (N1) o relaciones (N2).
*   **Microinteracciones:** Sellado de peritaje mediante `onLongPress` (1000ms).
