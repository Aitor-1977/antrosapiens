<body class="bg-surface text-on-surface min-h-screen flex flex-col font-ui-label selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->

<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight text-center flex-1">ANTROSAPIENS V3</h1>
<button aria-label="User profile settings" class="flex items-center justify-center h-full hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:opacity-80 active:scale-95 duration-150 transition-all">

<!-- Main Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto pt-[96px] pb-[120px] px-margin-mobile md:px-gutter flex flex-col gap-stack-lg">
<!-- Header Section -->

                Explora organizaciones, señales y fenómenos que podrían merecer una mirada más cercana.
            </p>
</section>
<!-- Search Input -->
<section class="w-full relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant group-focus-within:text-primary transition-colors" data-icon="search">search</span>
</div>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary py-4 pl-12 pr-4 font-body-reading text-body-reading text-on-surface placeholder:text-outline focus:ring-0 focus:outline-none transition-colors" placeholder="Escribe una organización, fenómeno, sector o pregunta..." type="text"/>
</section>
<!-- Filters Section (Bento/Tactile structure) -->
<section class="flex flex-col gap-stack-md mt-4">
<!-- Region Filter -->
<div class="flex flex-col gap-stack-sm">
<label class="font-metadata-code text-metadata-code text-outline tracking-wider uppercase">REGIÓN</label>
<div class="flex flex-wrap gap-stack-sm">

<button class="px-4 py-2 border border-outline-variant/30 text-on-surface-variant rounded-full font-body-reading text-ui-label hover:bg-surface-container-high transition-colors focus:bg-primary focus:text-on-primary focus:border-primary">México</button>
<button class="px-4 py-2 border border-outline-variant/30 text-on-surface-variant rounded-full font-body-reading text-ui-label hover:bg-surface-container-high transition-colors focus:bg-primary focus:text-on-primary focus:border-primary">México y Centroamérica</button>
<button class="px-4 py-2 border border-outline-variant/30 text-on-surface-variant rounded-full font-body-reading text-ui-label hover:bg-surface-container-high transition-colors focus:bg-primary focus:text-on-primary focus:border-primary">Sudamérica</button>
</div>
</div>
<hr class="border-outline-variant/30 w-1/3 my-2"/>
<!-- Focus Filter (poblado dinámicamente desde el backend real) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-metadata-code text-metadata-code text-outline tracking-wider uppercase">FOCO</label>
<div id="focoFilters" class="flex flex-wrap gap-stack-sm">
<button data-cat="" class="px-4 py-2 border border-primary bg-primary text-on-primary rounded-full font-body-reading text-ui-label transition-colors">Todos</button>
                <span id="focoLoading" class="font-metadata-code text-metadata-code text-outline self-center">Cargando categorías…</span>
        </div>
</div>
<hr class="border-outline-variant/30 w-1/3 my-2"/>
<!-- Vertical Filter (poblado dinámicamente desde el backend real) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-metadata-code text-metadata-code text-outline tracking-wider uppercase">VERTICAL</label>
<div id="verticalFilters" class="flex flex-wrap gap-stack-sm">
<button data-val="" class="px-4 py-2 border border-primary bg-primary text-on-primary rounded-full font-body-reading text-ui-label transition-colors">Todos</button>
<span id="verticalLoading" class="font-metadata-code text-metadata-code text-outline self-center">Cargando verticales…</span>
</div>
</div>
<hr class="border-outline-variant/30 w-1/3 my-2"/>
<!-- Escala Filter (poblado dinámicamente desde el backend real) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-metadata-code text-metadata-code text-outline tracking-wider uppercase">ESCALA</label>
<div id="escalaFilters" class="flex flex-wrap gap-stack-sm">
<button data-val="" class="px-4 py-2 border border-primary bg-primary text-on-primary rounded-full font-body-reading text-ui-label transition-colors">Todos</button>
<span id="escalaLoading" class="font-metadata-code text-metadata-code text-outline self-center">Cargando escalas…</span>
</div>
</div>
</section>
<!-- Primary Action -->
<section class="mt-8 flex justify-end">
<button id="btnExplorar" class="bg-primary text-on-primary font-ui-label text-ui-label rounded-lg flex items-center gap-2 hover:bg-primary-fixed-variant transition-colors min-w-[200px] justify-center shadow-sm w-full py-6 text-lg shadow-lg">
                Comenzar exploración
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</section>
<!-- Resultados (aparece tras Comenzar exploración; sustituye a Mesa de Resultados hasta que exista esa pantalla) -->
<section id="resultados" class="hidden flex flex-col gap-stack-md">
<hr class="border-outline-variant/30"/>
<div class="flex items-baseline justify-between">

<!-- EXPLORAR (Active) -->
<a class="flex-1 min-w-0 flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim bg-primary-container/10 rounded-xl py-1 active:scale-90 duration-200 ease-in-out transition-transform" href="#">
<span class="material-symbols-outlined filled" data-icon="explore" data-weight="fill">explore</span>
<span class="font-ui-label leading-tight mt-1 text-[9px] text-center break-words">EXPLORAR</span>
</a>
<!-- OBSERVAR (Inactive) -->
<a class="flex-1 min-w-0 flex flex-col items-center justify-center text-outline dark:text-outline-variant py-1 hover:text-secondary dark:hover:text-secondary-fixed active:scale-90 duration-200 ease-in-out transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
<span class="font-ui-label leading-tight mt-1 text-[9px] text-center break-words">OBSERVAR</span>
</a>
<!-- TRIANGULAR (Inactive) -->
<a class="flex-1 min-w-0 flex flex-col items-center justify-center text-outline dark:text-outline-variant py-1 hover:text-secondary dark:hover:text-secondary-fixed active:scale-90 duration-200 ease-in-out transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="change_history">change_history</span>
<span class="font-ui-label leading-tight mt-1 text-[9px] text-center break-words">TRIANGULAR</span>
</a>
<!-- FIJAR (Inactive) -->
<a class="flex-1 min-w-0 flex flex-col items-center justify-center text-outline dark:text-outline-variant py-1 hover:text-secondary dark:hover:text-secondary-fixed active:scale-90 duration-200 ease-in-out transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="push_pin">push_pin</span>
<span class="font-ui-label leading-tight mt-1 text-[9px] text-center break-words">FIJAR</span>
</a>
</nav>
<script>
        const API = "https://antrosapiens-api-pro.vercel.app";
        let categoriaActiva = "";
        let verticalActiva = "";
        let escalaActiva = "";
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

        // --- Filtro REGIÓN: comportamiento visual tipo radio (sin datos backend aún) ---
        document.querySelectorAll('section .flex-wrap').forEach(group => {
            if (group.id === 'focoFilters') return; // FOCO se maneja aparte, con datos reales
            group.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', function() {
                    group.querySelectorAll('button').forEach(btn => {
                        btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                        btn.classList.add('border-outline-variant/30', 'text-on-surface-variant');
                    });
                    this.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                    this.classList.remove('border-outline-variant/30', 'text-on-surface-variant');
                });
            });
        });

        // --- Filtro FOCO: se puebla con las categorías reales del backend ---
        async function cargarCategorias() {
            const cont = document.getElementById('focoFilters');
            const loading = document.getElementById('focoLoading');
            try {
                const res = await fetch(`${API}/prospectos/categorias`);
                const data = await res.json();
                loading.remove();
                const cats = data.categorias || {};
                Object.keys(cats).forEach(nombre => {
                    const btn = document.createElement('button');
                    btn.dataset.cat = nombre;
                    btn.className = "px-4 py-2 border border-outline-variant/30 text-on-surface-variant rounded-full font-body-reading text-ui-label hover:bg-surface-container-high transition-colors";
                    btn.textContent = `${nombre} (${cats[nombre]})`;
                    btn.addEventListener('click', () => seleccionarFoco(btn));
                    cont.appendChild(btn);
                });
                document.querySelector('#focoFilters button[data-cat=""]').addEventListener('click', function() {
                    seleccionarFoco(this);
                });
            } catch (e) {
                loading.textContent = "No se pudieron cargar las categorías (backend no disponible).";
            }
        }

        function seleccionarFoco(btnSeleccionado) {
            categoriaActiva = btnSeleccionado.dataset.cat || "";
            document.querySelectorAll('#focoFilters button').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                btn.classList.add('border-outline-variant/30', 'text-on-surface-variant');
            });
            btnSeleccionado.classList.add('bg-primary', 'text-on-primary', 'border-primary');
            btnSeleccionado.classList.remove('border-outline-variant/30', 'text-on-surface-variant');
        }

        // --- Selección visual genérica (misma lógica que FOCO) para VERTICAL y ESCALA ---
        function seleccionarFiltro(cont, btnSeleccionado) {
            cont.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                btn.classList.add('border-outline-variant/30', 'text-on-surface-variant');
            });
            btnSeleccionado.classList.add('bg-primary', 'text-on-primary', 'border-primary');
            btnSeleccionado.classList.remove('border-outline-variant/30', 'text-on-surface-variant');
            const val = btnSeleccionado.dataset.val || "";
            if (cont.id === 'verticalFilters') verticalActiva = val;
            else if (cont.id === 'escalaFilters') escalaActiva = val;
        }

        // --- Filtros VERTICAL y ESCALA: se pueblan con valores únicos y conteos reales de /prospectos ---
        async function cargarFiltroProspectos(containerId, loadingId, campo) {
            const cont = document.getElementById(containerId);
            const loading = document.getElementById(loadingId);
            try {
                const res = await fetch(`${API}/prospectos?limite=500`);
                const data = await res.json();
                loading.remove();
                const conteo = {};
                (data.items || []).forEach(p => {
                    const v = String(p[campo] || "").trim();
                    if (!v) return;
                    conteo[v] = (conteo[v] || 0) + 1;
                });
                Object.keys(conteo).sort().forEach(valor => {
                    const btn = document.createElement('button');
                    btn.dataset.val = valor;
                    btn.className = "px-4 py-2 border border-outline-variant/30 text-on-surface-variant rounded-full font-body-reading text-ui-label hover:bg-surface-container-high transition-colors";
                    btn.textContent = `${valor} (${conteo[valor]})`;
                    btn.addEventListener('click', () => seleccionarFiltro(cont, btn));
                    cont.appendChild(btn);
                });
                const todos = cont.querySelector('button[data-val=""]');
                if (todos) todos.addEventListener('click', () => seleccionarFiltro(cont, todos));
            } catch (e) {
                loading.textContent = "No se pudo cargar (backend no disponible).";
            }
        }

        // --- Comenzar exploración: trae EXPEDIENTES curados (scoring, Deuda Cultural, evidencia), no la lista cruda ---
        document.getElementById('btnExplorar').addEventListener('click', async () => {
            const q = document.querySelector('input[type="text"]').value.trim().toLowerCase();
            const seccion = document.getElementById('resultados');
            const lista = document.getElementById('resultadosList');
            const count = document.getElementById('resultadosCount');
            seccion.classList.remove('hidden');
            lista.innerHTML = `<p class="font-body-reading text-on-surface-variant">Curando hallazgos…</p>`;
            try {
                const res = await fetch(`${API}/expedientes?limite=100`);
                const data = await res.json();
                let items = data.expedientes || [];
                if (categoriaActiva) items = items.filter(p => p.categoria === categoriaActiva);
                if (verticalActiva) items = items.filter(p => p.vertical === verticalActiva);
                if (escalaActiva) items = items.filter(p => p.escala === escalaActiva);
                if (q) items = items.filter(p => (p.nombre || "").toLowerCase().includes(q));
                count.textContent = `${items.length} expediente(s)`;
                if (!items.length) {
                    lista.innerHTML = `<p class="font-body-reading text-body-reading text-on-surface-variant">Sin expedientes curados con estos criterios todavía. El Radar sigue detectando; vuelve a intentar tras la próxima corrida.</p>`;
                    return;
                }
                const badge = (s) => ({A:'bg-primary text-on-primary', B:'bg-tertiary-container text-on-tertiary-container', C:'bg-error-container text-on-error-container'}[s] || 'bg-surface-container-high text-on-surface-variant');
                lista.innerHTML = items.slice(0, 30).map(p => `
                    <div class="p-4 border border-outline-variant/30 rounded-lg flex flex-col gap-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-headline-md-mobile text-on-surface text-lg">${esc(p.nombre)}</span>
                            <span class="px-2 py-0.5 rounded-full text-xs font-metadata-code ${badge(p.scoring)}">${esc(p.scoring || '?')}</span>
                            <span class="font-metadata-code text-metadata-code text-outline">ICP ${esc(p.score_icp ?? 0)}</span>
                            <span class="font-metadata-code text-metadata-code text-outline uppercase">${esc(p.categoria)}</span>
                        </div>
                        <p class="font-body-reading text-on-surface-variant text-sm">
                            <strong class="text-on-surface">Hipotesis: ${esc(p.tipo_deuda || 'no clasificada')}</strong>
                            ${p.deuda_razon ? ' · ' + esc(p.deuda_razon) : ''}
                        </p>
                        <span class="px-2 py-0.5 rounded-full text-xs font-metadata-code ${(p.validacion_cientifica && p.validacion_cientifica.hipotesis_bloqueada) ? 'bg-error text-on-error' : 'bg-secondary-container text-on-secondary-container'}">${(p.validacion_cientifica && p.validacion_cientifica.hipotesis_bloqueada) ? 'BLOQUEADA' : 'VALIDADA'}</span>
                        <p class="font-metadata-code text-metadata-code text-outline">
                            Señal dominante: ${esc(p.senal_dominante || '—')} · Evidencias: ${p.total_evidencias ?? 0}
                        </p>
                        ${(p.evidencias || []).slice(0, 2).map(ev => `
                            <div class="pl-3 border-l-2 border-outline-variant/40">
                                <p class="font-body-reading text-on-surface-variant text-sm italic">${esc(ev.texto || '')}</p>
                                <p class="font-metadata-code text-metadata-code text-outline">${esc(ev.fuente || '')} · ${esc(ev.fecha || '')}</p>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            } catch (e) {
                lista.innerHTML = `<p class="font-body-reading text-error">No se pudo conectar con el laboratorio. Intenta de nuevo.</p>`;
            }
        });

        cargarCategorias();
        cargarFiltroProspectos('verticalFilters', 'verticalLoading', 'vertical');
        cargarFiltroProspectos('escalaFilters', 'escalaLoading', 'escala');
    </script>
</body></html>
