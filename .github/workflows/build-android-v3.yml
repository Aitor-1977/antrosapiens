name: Build Android APK (android_v3)
on:
  push:
    branches:
      - 'claude/antrolabs-project-status-wbttmj'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x ./android_v3/gradlew
      - working-directory: ./android_v3
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: antrolabs-apk
          path: android_v3/app/build/outputs/apk/debug/app-debug.apk
