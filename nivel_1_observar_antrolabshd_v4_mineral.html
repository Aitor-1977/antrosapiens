<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSERVAR (V4) - AntrolabsHD Rigor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #E8E4DC; color: #111111; font-family: 'Inter', sans-serif; }
        .font-serif-voice { font-family: 'Playfair Display', serif; }
        .font-tech { font-family: 'IBM Plex Mono', monospace; }
    </style>
</head>
<body class="min-h-screen pb-24">
    <header class="sticky top-0 z-50 bg-[#E8E4DC]/95 backdrop-blur border-b border-[#111111]/10 px-4 h-16 flex items-center justify-between">
        <span class="font-serif-voice text-lg font-semibold text-[#5A7A00]">Mesa de Evidencias</span>
        <span class="font-tech text-xs text-[#111111]/60">NIVEL 1</span>
    </header>
    <main class="px-4 pt-6 max-w-md mx-auto space-y-4">
        <div class="bg-white p-5 rounded-xl border border-[#5A7A00]/30 shadow-sm">
            <div class="flex justify-between items-center mb-2">
                <span class="font-tech text-xs font-bold text-[#5A7A00]">EV-2024-04-12A</span>
                <span class="font-tech text-[10px] bg-[#5A7A00]/10 text-[#5A7A00] px-2 py-0.5 rounded font-bold">VERIFICADO</span>
            </div>
            <p class="font-serif-voice italic text-base text-[#111111] mb-3">"El sistema nuevo nos obliga a registrar todo dos veces. Dicen que es para agilizar, pero en la práctica termino llevándome trabajo a casa..."</p>
            <div class="text-xs font-tech text-[#111111]/60 border-t border-[#111111]/10 pt-2 flex justify-between">
                <span>Actor: M. Roldán (Operaciones)</span>
                <span>12 Abr 2024</span>
            </div>
        </div>
    </main>
    <nav class="fixed bottom-0 left-0 right-0 bg-[#E8E4DC] border-t border-[#111111]/10 h-20 flex justify-around items-center px-2 z-50">
        <div class="flex flex-col items-center text-[#111111]/60"><span class="text-xs font-tech uppercase">Explorar</span></div>
        <div class="flex flex-col items-center text-[#5A7A00] font-bold"><span class="text-xs font-tech uppercase">Observar</span></div>
        <div class="flex flex-col items-center text-[#111111]/60"><span class="text-xs font-tech uppercase">Triangular</span></div>
        <div class="flex flex-col items-center text-[#111111]/60"><span class="text-xs font-tech uppercase">Fijar</span></div>
    </nav>
</body>
</html>
